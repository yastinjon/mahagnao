<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login &mdash; MVNP Research Repository</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="emblem-bg">

<header>
  <div class="nav">
    <div class="nav-left">
      <div class="nav-logos">
        <img src="assets/denr-logo.png" alt="DENR Logo">
        <img src="assets/mvnp-logo.png" alt="MVNP Logo">
      </div>
      <div>
        <div class="nav-title">MVNP Research Repository</div>
        <div class="nav-sub">Mahagnao Volcano Natural Park&nbsp;&bull;&nbsp;Official Research Archive</div>
      </div>
    </div>
    <nav class="nav-links">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="repository.html" data-page="repository.html">Repository</a>
      <a href="assets/mvnp-research-guidelines.pdf" target="_blank">Guidelines</a>
      <a href="about.html" data-page="about.html">About</a>
      <a href="contact.html" data-page="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main>
<div class="auth-card">
  <h1>Sign in</h1>
  <p>Access the MVNP research repository with your account.</p>

  <form id="loginForm" class="auth-form">
    <div id="formError" class="form-errors" style="display:none;"></div>

    <label>
      Username
      <input type="text" id="username" name="username" autocomplete="username" required>
    </label>

    <label>
      Password
      <div class="password-wrapper">
        <input type="password" id="password" name="password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" aria-label="Toggle password visibility" onclick="togglePassword(this)">
          <svg class="eye-icon eye-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-icon eye-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
            <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>
    </label>

    <button type="submit" class="btn btn-primary">Sign in</button>
  </form>

  <p style="margin-top:1.25rem;">
    Don't have an account? <a href="signup.html" style="text-decoration:none; color:#000; font-weight:bold;">Create one</a>.
  </p>
  <p style="font-size:.8rem; color:var(--muted); margin-top:1rem;">
  </p>
</div>
</main>

<footer>
  <p>&copy; 2026 Mahagnao Volcano Natural Park &ndash; Protected Area Management Office</p>
</footer>

<script src="auth.js"></script>
<script src="main.js"></script>
<script>
function togglePassword(btn) {
  var wrapper = btn.closest('.password-wrapper');
  var input = wrapper.querySelector('input');
  var eyeOpen = btn.querySelector('.eye-open');
  var eyeClosed = btn.querySelector('.eye-closed');
  if (input.type === 'password') {
    input.type = 'text'; eyeOpen.style.display = 'none'; eyeClosed.style.display = 'inline';
  } else {
    input.type = 'password'; eyeOpen.style.display = 'inline'; eyeClosed.style.display = 'none';
  }
}

document.addEventListener('DOMContentLoaded', function () {
  if (MVNP.isAuthenticated()) { location.href = 'index.html'; return; }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var res = MVNP.login(username, password);
    var err = document.getElementById('formError');
    if (!res.ok) {
      err.textContent = res.error;
      err.style.display = 'block';
      return;
    }
    MVNP.flash('You have successfully logged in.', 'success');
    var params = new URLSearchParams(location.search);
    location.href = params.get('next') || 'index.html';
  });
});
</script>
</body>
</html>
