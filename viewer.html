<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Study Viewer &mdash; MVNP Repository</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="nav">
    <div class="nav-left">
      <div class="nav-logos">
        <img src="assets/denr-logo.png" alt="DENR Logo">
        <img src="assets/mvnp-logo.png" alt="MVNP Logo">
      </div>
      <div>
        <div class="nav-title">MVNP Research Repository</div>
        <div class="nav-sub">Mahagnao Volcano Natural Park&nbsp;&bull;&nbsp;Official Research Archive</div>
      </div>
    </div>
    <nav class="nav-links">
      <a href="index.html" data-page="index.html">Home</a>
      <a href="repository.html" data-page="repository.html">Repository</a>
      <a href="assets/mvnp-research-guidelines.pdf" target="_blank">Guidelines</a>
      <a href="about.html" data-page="about.html">About</a>
      <a href="contact.html" data-page="contact.html">Contact</a>
    </nav>
  </div>
</header>

<main id="main-content">
  <p style="color:var(--muted);">Loading study...</p>
</main>

<footer>
  <p>&copy; 2026 Mahagnao Volcano Natural Park &ndash; Protected Area Management Office</p>
</footer>

<script src="auth.js"></script>
<script src="data.js"></script>
<script src="main.js"></script>
<script>
  var params = new URLSearchParams(location.search);
  var id = params.get('id');
  var study = MVNP.getStudies().find(function (s) { return s.study_id === id; });
  var main = document.getElementById('main-content');

  if (!study) {
    main.innerHTML =
      '<div class="content-card" style="text-align:center;color:var(--muted);padding:2rem;">' +
      '<p>Study not found.</p>' +
      '<p style="margin-top:.5rem;"><a class="btn btn-secondary" href="repository.html">Back to Repository</a></p>' +
      '</div>';
  } else {
    document.getElementById('page-title').textContent = study.title + ' \u2014 MVNP Repository';

    var pdfBlock = study.pdf_file
      ? '<div class="pdf-container"><iframe id="pdfFrame" src="' + study.pdf_file + '" title="PDF Viewer">' +
        '<p style="text-align:center;padding:2rem;color:var(--muted);">Your browser does not support inline PDF viewing. ' +
        '<a href="' + study.pdf_file + '">Click here to download the PDF.</a></p></iframe></div>'
      : '<div class="content-card" style="text-align:center;color:var(--muted);padding:2rem;">' +
        '<p>No PDF file is currently attached to this study.</p></div>';

    main.innerHTML =
      '<div class="viewer-header">' +
      '<h1>' + study.title + '</h1>' +
      '<p style="color:var(--muted);">' + study.authors + '</p>' +
      '<div class="viewer-meta">' +
      '<span>Year: ' + study.year + '</span>' +
      '<span>Type: ' + study.study_type + '</span>' +
      '<span>' + study.status + '</span>' +
      '<span class="tag">' + study.category + '</span>' +
      '</div>' +
      (study.abstract ? '<p style="margin-top:.75rem;color:var(--muted);">' + study.abstract + '</p>' : '') +
      '<div class="viewer-actions">' +
      (study.pdf_file ? '<a class="btn btn-primary btn-sm" href="' + study.pdf_file + '" target="_blank">Download PDF</a>' : '') +
      '<a class="btn btn-secondary btn-sm" href="repository.html">Back to Repository</a>' +
      '</div>' +
      '</div>' +
      pdfBlock;
  }
</script>
</body>
</html>
